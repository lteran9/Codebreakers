[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codebreakers"
version = "0.1.0"
description = "A Python project for solving codebreaking problems."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Codebreakers contributors" }]
dependencies = [
    "typer>=0.12",
]

[project.scripts]
codebreakers = "codebreakers.cli.main:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=codebreakers --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
markers = [
    "unit: fast unit tests that do not require services or external integrations.",
    "integration: tests that exercise external services or slow dependencies.",
]

[tool.coverage.run]
branch = true
source = ["src/codebreakers"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
