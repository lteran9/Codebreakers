version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base image digests in the Dockerfile (python:3.12-slim-trixie).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Pinned service images in compose.yaml (postgres).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"

  # Provider versions and lock files for both Terraform stacks.
  - package-ecosystem: "terraform"
    directories:
      - "/infra/bootstrap"
      - "/infra/azure"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
