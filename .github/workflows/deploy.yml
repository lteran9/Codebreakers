name: Deploy

# Reusable staged deployment of the image built and checked by CI (ADR-0013).
# Authenticates to Azure with OpenID Connect: the GitHub environment holds only
# non-secret identifiers (Terraform `github_environment_variables` output) and
# the federated credential trusts jobs in that environment alone.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment (and Azure environment) to deploy to.
        required: true
        type: string

permissions: {}

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CONFIGURED: ${{ vars.AZURE_CLIENT_ID != '' }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
      AZURE_API_APP: ${{ vars.AZURE_API_APP }}
      AZURE_RELAY_APP: ${{ vars.AZURE_RELAY_APP }}
      AZURE_WORKER_APP: ${{ vars.AZURE_WORKER_APP }}
      AZURE_MIGRATE_JOB: ${{ vars.AZURE_MIGRATE_JOB }}
      AZURE_RETENTION_JOB: ${{ vars.AZURE_RETENTION_JOB }}
    steps:
      - name: Check environment is provisioned
        if: env.CONFIGURED != 'true'
        env:
          TARGET: ${{ inputs.environment }}
        run: >-
          echo "::notice::The $TARGET environment has no Azure
          variables yet; skipping deployment. Apply Terraform and copy its
          github_environment_variables output (docs/operations/azure-runbook.md)."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CONFIGURED == 'true'
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.CONFIGURED == 'true'
        with:
          name: image
          path: build/container

      - name: Load tested image
        if: env.CONFIGURED == 'true'
        run: gunzip -c build/container/image.tar.gz | docker load

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: env.CONFIGURED == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Tagged with the immutable commit SHA; `latest` is never pushed.
      - name: Push image to ACR
        id: push
        if: env.CONFIGURED == 'true'
        run: |
          image="$AZURE_ACR_LOGIN_SERVER/codebreakers:$GITHUB_SHA"
          az acr login --name "$AZURE_ACR_NAME"
          docker tag codebreakers:local "$image"
          docker push "$image"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.CONFIGURED == 'true'
        with:
          subject-name: ${{ env.AZURE_ACR_LOGIN_SERVER }}/codebreakers
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Deploy revision, smoke-test, shift traffic
        id: deploy
        if: env.CONFIGURED == 'true'
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: scripts/deploy_revision.sh "$IMAGE"
