name: CI

# Every action is pinned to a full commit SHA (Dependabot proposes updates);
# the trailing comment records the release it corresponds to.

on:
  push:
    branches: [master]
  pull_request:
  # Release runs the same gates on the tagged commit before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Unit and property tests, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The cache only speeds up downloads; pip still resolves the same
      # versions, and the image installs from hash-locked requirements.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Check locked runtime telemetry imports
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/runtime"
          pip --python "$RUNNER_TEMP/runtime/bin/python" install --require-hashes --no-deps -r requirements/runtime.txt
          "$RUNNER_TEMP/runtime/bin/python" -c '
          from azure.monitor.opentelemetry import configure_azure_monitor
          from azure.monitor.opentelemetry.exporter import (
              AzureMonitorLogExporter, AzureMonitorMetricExporter, AzureMonitorTraceExporter,
          )'

      - name: Run unit and property tests with coverage
        run: pytest -m 'not integration' --cov=codebreakers --cov-report=term-missing --cov-fail-under=80

      - name: Check lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check types
        run: mypy src tests

  integration:
    name: PostgreSQL integration and migration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      # Testcontainers starts PostgreSQL; Alembic migrations run against it.
      - name: Run integration tests
        run: pytest -m integration -o addopts=''

  source-scan:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan locked dependencies and source for secrets
        run: make scan-source

  infrastructure:
    name: Terraform checks and IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      # Credential-free: fmt, validate, mock-provider tests, and Checkov.
      # Infrastructure plans and applies run only from the reviewed runbook flow.
      - name: Check Terraform
        run: make tf-check

  image:
    name: Image build, policy, scan, and container smoke
    runs-on: ubuntu-latest
    env:
      IMAGE: codebreakers:local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Layer caching is safe: the base image is pinned by digest and every
      # Python dependency is installed from hash-locked requirements.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          build-args: CODEBREAKERS_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check image policy
        run: make image-check

      - name: Scan image and generate SBOM
        run: make scan sbom

      - name: Run stack smoke test
        run: |
          docker compose up --wait
          make smoke

      - name: Check graceful shutdown
        run: make shutdown-check

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes

      # The exact image that passed these checks is what gets deployed.
      - name: Export image
        if: github.event_name == 'push'
        run: docker save "$IMAGE" | gzip > build/container/image.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: image
          path: |
            build/container/image.tar.gz
            build/container/sbom.cdx.json
          retention-days: 14
          if-no-files-found: error

  deploy-dev:
    name: Deploy to dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [quality, integration, source-scan, infrastructure, image]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
