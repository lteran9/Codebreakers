name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run tests with coverage
        run: pytest -m 'not integration' --cov=codebreakers --cov-report=term-missing --cov-fail-under=80

      - name: Run PostgreSQL integration tests
        if: github.event_name == 'pull_request'
        run: pytest -m integration -o addopts=''

      - name: Check lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check types
        run: mypy src tests

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      # Credential-free: fmt, validate, mock-provider tests, and Checkov.
      # Plans and applies run only from the reviewed runbook flow.
      - name: Check Terraform
        run: make tf-check
