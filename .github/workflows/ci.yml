name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: pytest
      - name: Check lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Check types
        run: mypy src
