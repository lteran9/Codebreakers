name: Rollback

# Return an environment's API traffic to a previous healthy revision and
# realign the worker, relay, and jobs with its image. Runs in the selected
# GitHub environment, so production rollbacks need the same approval as
# deployments. See docs/operations/rollback-runbook.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back.
        required: true
        type: choice
        options: [dev, production]
      revision:
        description: Revision name to restore (blank = the one before the serving revision).
        required: false
        type: string

permissions: {}

jobs:
  rollback:
    name: Roll back ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_API_APP: ${{ vars.AZURE_API_APP }}
      AZURE_RELAY_APP: ${{ vars.AZURE_RELAY_APP }}
      AZURE_WORKER_APP: ${{ vars.AZURE_WORKER_APP }}
      AZURE_MIGRATE_JOB: ${{ vars.AZURE_MIGRATE_JOB }}
      AZURE_RETENTION_JOB: ${{ vars.AZURE_RETENTION_JOB }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Roll back
        env:
          REVISION: ${{ inputs.revision }}
        run: scripts/rollback_revision.sh ${REVISION:+"$REVISION"}
